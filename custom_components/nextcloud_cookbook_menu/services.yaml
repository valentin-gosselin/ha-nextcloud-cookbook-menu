add_to_menu:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nextcloud_cookbook_menu
    recipe:
      required: true
      example: "salade césar"
      selector:
        text:
    day:
      example: "jeudi"
      selector:
        text:
    servings:
      selector:
        number:
          min: 1
          max: 50
          mode: box
    recipe_id:
      selector:
        text:

remove_from_menu:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nextcloud_cookbook_menu
    recipe:
      example: "carry"
      selector:
        text:
    uid:
      selector:
        text:

set_servings:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nextcloud_cookbook_menu
    recipe:
      example: "carry"
      selector:
        text:
    uid:
      selector:
        text:
    servings:
      required: true
      selector:
        number:
          min: 1
          max: 50
          mode: box

new_week:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nextcloud_cookbook_menu

search_recipes:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nextcloud_cookbook_menu
    query:
      required: true
      example: "gratin"
      selector:
        text:
    limit:
      default: 5
      selector:
        number:
          min: 1
          max: 50
          mode: box

get_history:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nextcloud_cookbook_menu
    recipe:
      example: "carry"
      selector:
        text:
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 500
          mode: box

out_of_stock:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nextcloud_cookbook_menu
    product:
      required: true
      example: "huile d'olive"
      selector:
        text:

start_timer:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nextcloud_cookbook_menu
    seconds:
      required: true
      example: 1500
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    name:
      example: "Étape 3 - Carry de poulet"
      selector:
        text:

stop_timer:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nextcloud_cookbook_menu
    timer:
      example: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
