add_to_menu:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: cookbook_menu
    recipe:
      required: true
      example: "salade césar"
      selector:
        text:
    day:
      example: "jeudi"
      selector:
        text:
    servings:
      selector:
