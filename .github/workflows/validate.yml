name: Validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validation HACS
    runs-on: ubuntu-latest
    # Tant que le dépôt est privé, HACS ne peut lire ni hacs.json ni manifest.json (contenu brut
    # inaccessible). À retirer dès le passage en public, pour que la validation devienne bloquante.
    continue-on-error: true
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # HACS lit la branche par défaut du dépôt : ce job ne reflète une branche de story qu'une fois fusionnée.
          # Tant que le dépôt est privé et sans brands publiés, ces contrôles ne peuvent pas passer.
          ignore: brands description topics

  tests:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Installer les dépendances de test
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest
        run: pytest --cov --cov-report=term-missing
