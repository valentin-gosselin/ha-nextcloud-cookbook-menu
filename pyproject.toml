[project]
name = "cookbook-menu"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["_bmad", "_bmad-output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.coverage.run]
source = ["custom_components.nextcloud_cookbook_menu"]
